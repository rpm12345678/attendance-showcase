<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Executive Showcase</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .header h1 { font-size: 24px; color: #38bdf8; }
    .status-badge { background: #0284c7; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    
    /* Grid KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .kpi-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
    .kpi-card h3 { font-size: 13px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
    .kpi-card .number { font-size: 32px; font-weight: bold; }
    .c-total { color: #f8fafc; }
    .c-checkin { color: #4ade80; }
    .c-telat { color: #facc15; }
    .c-nocheckin { color: #f87171; }

    /* Chart Container */
    .chart-container { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
  </style>
</head>
<body>

  <div class="header">
    <h1>GA DSM — Attendance Live Showcase</h1>
    <span class="status-badge" id="lastUpdate">Syncing...</span>
  </div>

  <!-- KPI CARDS -->
  <div class="kpi-grid">
    <div class="kpi-card"><h3>Total Karyawan</h3><div class="number c-total" id="kpiTotal">59</div></div>
    <div class="kpi-card"><h3>Check In</h3><div class="number c-checkin" id="kpiCheckIn">46</div></div>
    <div class="kpi-card"><h3>Telat</h3><div class="number c-telat" id="kpiTelat">6</div></div>
    <div class="kpi-card"><h3>No Check In</h3><div class="number c-nocheckin" id="kpiNoCheckIn">13</div></div>
  </div>

  <!-- CHART TREND -->
  <div class="chart-container">
    <canvas id="attendanceChart" height="100"></canvas>
  </div>

  <script>
    // URL CSV dari Google Sheets (File -> Share -> Publish to Web -> Format CSV)
    const PUBLISHED_SHEET_CSV_URL = "URL_PUBLISH_TO_WEB_CSV_COACH_DI_SINI";

    async function loadDashboardData() {
      try {
        // Tarik data CSV langsung dari Google Sheets
        const response = await fetch(PUBLISHED_SHEET_CSV_URL);
        const csvText = await response.text();
        
        // Parse data sederhana (Atau panggil data statistik langsung)
        document.getElementById("lastUpdate").innerText = "LIVE • " + new Date().toLocaleTimeString('id-ID');
      } catch (err) {
        console.log("Demo Mode / Local Fallback Active");
        document.getElementById("lastUpdate").innerText = "LIVE DEMO";
      }
    }

    // Chart.js Setup
    const ctx = document.getElementById('attendanceChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'],
        datasets: [
          { label: 'Check In', data: [46, 50, 48, 52, 49, 45], backgroundColor: '#22c55e' },
          { label: 'Telat', data: [6, 3, 5, 2, 4, 1], backgroundColor: '#eab308' },
          { label: 'No Check In', data: [7, 6, 6, 5, 6, 13], backgroundColor: '#ef4444' }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#f8fafc' } } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
        }
      }
    });

    loadDashboardData();
  </script>
</body>
</html>
